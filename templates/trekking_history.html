<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trekking History</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(136, 191, 77);">


<div class="container py-4">

    <!-- Page Heading -->

    <h1 class="text-center mb-4">
        My Trekking History
    </h1>


    <!-- Trekking History Card -->

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Responsive Table -->

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Booking ID</th>
                            <th>Trek Name</th>
                            <th>Location</th>
                            <th>Booking Date</th>
                            <th>Booking Status</th>
                        </tr>

                    </thead>

                    <tbody>

                        {% for booking in bookings %}

                        <tr>
                            <td>{{ booking.id }}</td>
                            <td>{{ booking.trek.trek_name }}</td>
                            <td>{{ booking.trek.location }}</td>
                            <td>{{ booking.booking_date }}</td>
                            <td>{{ booking.booking_status }}</td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>
        </div>
    </div>

    <!-- Back Button -->

    <div class="mt-4">


        <a href="/user/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>


    </div>
</div>


</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Trekking History</title>
</head>

<body>

<h1>My Trekking History</h1>

<table border="1" cellpadding="10">

<tr>
    <th>Booking ID</th>
    <th>Trek Name</th>
    <th>Location</th>
    <th>Booking Date</th>
    <th>Booking Status</th>
</tr>

{% for booking in bookings %}

<tr>
    <td>{{ booking.id }}</td>
    <td>{{ booking.trek.trek_name }}</td>
    <td>{{ booking.trek.location }}</td>
    <td>{{ booking.booking_date }}</td>
    <td>{{ booking.booking_status }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/user/dashboard">
    Back to Dashboard
</a>

</body>

</html>

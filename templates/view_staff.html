<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View Staff</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(136, 191, 214);">

<div class="container py-4">

    <!-- Page Heading -->

    <h1 class="text-center mb-4">
        Approved Staff Members
    </h1>


    <!-- Search Section -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form method="GET">

                <div class="row g-2">
                    <div class="col-12 col-md-9">

                        <input type="text"
                               name="search"
                               class="form-control"
                               placeholder="Search Staff...">

                    </div>

                    <div class="col-12 col-md-3">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Search

                        </button>

                    </div>
                </div>

            </form>

        </div>
    </div>


    <!-- Staff Table -->

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">


                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody>


                        {% for staff in staff_members %}


                        <tr>
                            <td>{{ staff.id }}</td>
                            <td>{{ staff.full_name }}</td>
                            <td>{{ staff.email }}</td>
                            <td>{{ staff.status }}</td>
                        </tr>


                        {% endfor %}


                    </tbody>

                </table>

            </div>
        </div>
    </div>


    <!-- Back Button -->

    <div class="mt-4">

        <a href="/admin/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
</div>

</body>

</html>

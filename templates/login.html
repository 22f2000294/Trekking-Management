<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: rgb(20, 141, 40);">


<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="card shadow">     <!--Creates a Bootstrap card-style container Adds a small shadow around that card-->
                <div class="card-body p-4">   <!--It creates the main content area inside a card-->
                    <h2 class="text-center mb-4">
                        Login
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">     <!--form to input email-->
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">      <!--form to input email-->
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <!--SUBMIT BUTTON-->
                        <button type="submit"
                                class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Available Treks</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(31, 174, 179);">


<div class="container py-4">


    <!-- Page Heading -->

    <h1 class="text-center mb-4">
        Available Treks
    </h1>


    <!-- Search and Filter Section -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="GET">

                <div class="row g-3 align-items-end">

                    <!-- Location Search -->

                    <div class="col-12 col-md-5">

                        <label class="form-label">
                            Search by Location
                        </label>

                        <input type="text"
                               name="search"
                               class="form-control"
                               placeholder="Enter location">

                    </div>


                    <!-- Difficulty Filter -->

                    <div class="col-12 col-md-4">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select name="difficulty"
                                class="form-select">

                            <option value="">All</option>

                            <option value="Easy">
                                Easy
                            </option>

                            <option value="Moderate">
                                Moderate
                            </option>

                            <option value="Hard">
                                Hard
                            </option>

                        </select>

                    </div>


                    <!-- Search Button -->

                    <div class="col-12 col-md-3">

                        <button type="submit"
                                class="btn btn-info w-100">

                            Search

                        </button>

                    </div>
                </div>

            </form>

        </div>
    </div>


    <!-- Available Treks Table -->

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">


                        <tr>

                            <th>ID</th>
                            <th>Trek Name</th>
                            <th>Difficulty</th>
                            <th>Duration</th>
                            <th>Available Slots</th>
                            <th>Action</th>
                        </tr>


                    </thead>

                    <tbody>


                        {% for trek in treks %}


                        <tr>
                            <td>{{ trek.id }}</td>
                            <td>{{ trek.trek_name }}</td>
                            <td>{{ trek.difficulty }}</td>
                            <td>{{ trek.duration_days }}</td>
                            <td>{{ trek.available_slots }}</td>
                            <td>

                                <a href="/user/book_trek/{{ trek.id }}"
                                   class="btn btn-sm btn-success">

                                    Book Now

                                </a>

                            </td>

                        </tr>


                        {% endfor %}

                    </tbody>

                </table>

            </div>
        </div>
    </div>


    <!-- Back Button -->

    <div class="mt-4">

        <a href="/login"
           class="btn btn-dark">

            Back

        </a>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Available Treks</title>
</head>

<body>

<h1>Available Treks</h1>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Trek Name</th>
    <th>Difficulty</th>
    <th>Duration</th>
    <th>Available Slots</th>
    <th>Action</th>
</tr>

{% for trek in treks %}

<tr>

<td>{{ trek.id }}</td>
<td>{{ trek.trek_name }}</td>
<td>{{ trek.difficulty }}</td>
<td>{{ trek.duration_days }}</td>
<td>{{ trek.available_slots }}</td>

<td>

<a href="/user/book_trek/{{ trek.id }}">
    Book Now
</a>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/login">
Back
</a>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>Admin Dashboard</h1>

<hr>

<h3>Total Treks : {{ total_treks }}</h3>

<h3>Total Users : {{ total_users }}</h3>

<h3>Total Staff : {{ total_staff }}</h3>

<h3>Total Bookings : {{ total_bookings }}</h3>

<hr>

<h2>Admin Statistics</h2>

<canvas id="adminChart" width="350" height="150"></canvas>

<br>

<a href="/admin/pending_staff">Pending Staff Requests</a>
<br><br>

<a href="/admin/add_trek">Add Trek</a>
<br><br>

<a href="/admin/treks">View All Treks</a>
<br><br>

<a href="/admin/staff">View Staff</a>

<br><br>

<a href="/admin/users">
View All Users
</a>

<br><br>

<a href="/admin/bookings">
View All Bookings
</a>

<br><br>

<a href="{{ url_for('auth.admin_trekking_history') }}">
    View Trekking History
</a>

</body>


<script>

    const ctx = document.getElementById("adminChart");

    new Chart(ctx, {

        type: "bar",

        data: {

            labels: [
                "Total Treks",
                "Total Bookings",
                "Total Users"
            ],

            datasets: [{

                label: "Admin Statistics",

                data: [
                    {{ total_treks }},
                    {{ total_bookings }},
                    {{ total_users }}
                ],

                backgroundColor: [
                    "pink",
                    "green",
                    "blue"
                ]

            }]

        }

    });

</script>

</html>

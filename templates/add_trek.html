<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Trek</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(2, 55, 77);">
<!-- Sets the background color of the complete page -->

<div class="container py-5">   <!--container of complete add_trek-->
    <div class="row justify-content-center">      <!--Creates a Bootstrap row and places its content in the center horizontally.-->
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">       <!--actual container of that card-->

                    <h1 class="text-center mb-4">
                        Add New Trek
                    </h1>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Trek Name
                            </label>

                            <input type="text"
                                   name="trek_name"
                                   class="form-control"
                                   placeholder="Enter trek name"
                                   minlength="2"
                                   maxlength="100"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input type="text"
                                   name="location"
                                   class="form-control"
                                   placeholder="Enter trek location"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Difficulty
                            </label>

                            <select name="difficulty"
                                    class="form-select">

                                <option>Easy</option>
                                <option>Moderate</option>
                                <option>Hard</option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Duration (Days)
                            </label>

                            <input type="number"
                                   name="duration_days"
                                   class="form-control"
                                   placeholder="Enter trek duration"
                                   min="1"
                                   required>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Available Slots
                            </label>

                            <input type="number"
                                   name="available_slots"
                                   class="form-control"
                                   placeholder="Enter available slots"
                                   min="1"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">  <!--w-100 Makes the Add Trek button take the full available width.-->

                            Add Trek

                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>

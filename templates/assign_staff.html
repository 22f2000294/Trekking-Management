<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assign Staff</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(2, 55, 77);">


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">


                    <h2 class="text-center mb-4">

                        Assign Staff to {{ trek.trek_name }}     <!--Displays the name of the trek received from the Flask backend.-->

                    </h2>

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label">

                                Select Staff

                            </label>

                            <!--Creates a dropdown menu for selecting a staff member.-->
                            <select name="staff_id"         
                                    class="form-select">

                                {% for staff in staff_members %}

                                <option value="{{ staff.id }}">

                                    {{ staff.full_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Assign Staff

                        </button>

                    </form>

                    <div class="mt-3">      <!--margin,top-btstrp spacing size -->

                        <a href="/admin/treks"
                           class="btn btn-outline-dark w-100">

                            Back to Treks

                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Trek</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(2, 55, 77);">


<div class="container py-5">


    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">


                    <h1 class="text-center mb-4">
                        Edit Trek
                    </h1>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">   <!--after clicking edit trek a form will open for input trek name-->
                                Trek Name
                            </label>

                            <input type="text"
                                   name="trek_name"
                                   value="{{ trek.trek_name }}"
                                   class="form-control"
                                   minlength="2"
                                   maxlength="100"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">  <!--after clicking edit trek a form will open for input loc-->
                                Location
                            </label>

                            <input type="text"
                                   name="location"
                                   value="{{ trek.location }}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label"> <!--after clicking edit trek a form will open for input difficulty-->
                                Difficulty
                            </label>

                            <select name="difficulty"
                                    class="form-select">     <!--drop down select button-->

                                <option {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                    Easy
                                </option>

                                <option {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                    Moderate
                                </option>

                                <option {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                    Hard
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">  <!--after clicking edit trek a form will open for input duration-->
                                Duration (Days)
                            </label>

                            <input type="number"
                                   name="duration_days"
                                   value="{{ trek.duration_days }}"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">   <!--after clicking edit trek a form will open for input slots-->
                                Available Slots
                            </label>

                            <input type="number"
                                   name="available_slots"
                                   value="{{ trek.available_slots }}"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Update Trek

                        </button>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>

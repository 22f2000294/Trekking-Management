<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Users</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(136, 191, 77);">

<div class="container py-4">

    <!-- Page Heading -->

    <h1 class="text-center mb-4">
        All Users
    </h1>


    <!-- Search Section -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form method="GET">

                <div class="row g-2">
                    <div class="col-12 col-md-9">

                        <input type="text"
                               name="search"
                               class="form-control"
                               placeholder="Search user...">

                    </div>

                    <div class="col-12 col-md-3">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Search

                        </button>
                    </div>
                </div>

            </form>

        </div>
    </div>

    <!-- Users Table -->

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for user in users %}

                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.full_name }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.role }}</td>
                            <td>{{ user.status }}</td>

                            <td>

                                {% if user.role == "Admin" %}

                                    -

                                {% elif user.status == "approved" %}

                                    <a href="/admin/deactivate_user/{{ user.id }}"
                                       class="btn btn-sm btn-danger">

                                        Deactivate

                                    </a>

                                {% else %}

                                    <a href="/admin/activate_user/{{ user.id }}"
                                       class="btn btn-sm btn-success">

                                        Activate

                                    </a>

                                {% endif %}

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>
        </div>
    </div>

    <!-- Back Button -->

    <div class="mt-4">

        <a href="/admin/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
</div>

</body>
</html>

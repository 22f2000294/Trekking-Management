<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>User Dashboard</h1>

<br><br>

<a href="/user/profile">
    Update Profile
</a>

<br><br>

<a href="/user/treks">
    View Available Treks
</a>

<br><br>

<a href="/user/bookings">
    My Bookings
</a>

<a href="/user/trekking_history">
    Trekking History
</a>

<br><br>

<h2>My Booking Trends</h2>

<div style="width: 720px; height: 420px;">

    <canvas id="userChart"></canvas>

</div>

<br>

<script>

    const ctx = document.getElementById("userChart");

    new Chart(ctx, {

        type: "bar",

        data: {

            labels: [
                "Booked",
                "Cancelled",
                "Completed"
            ],

            datasets: [{

                label: "My Bookings",

                data: [
                    {{ booked_count }},
                    {{ cancelled_count }},
                    {{ completed_count }}
                ],

                backgroundColor: [
                    "red",
                    "green",
                    "blue"
                ]

            }]

        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }

    });

</script>

</body>
</html>

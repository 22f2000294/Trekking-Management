<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: rgb(15, 15, 15);">
<div class="container">


    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        User Registration
                    </h2>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   placeholder="Enter your full name"
                                   minlength="2"
                                   maxlength="100"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   minlength="6"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <select name="role"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="trekker">
                                    Trekker
                                </option>

                                <option value="staff">
                                    Trek Staff
                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Register

                        </button>

                        <!-- Addition of already have an account option below submit button -->
                        <div class="text-center mt-3">
                            <p>
                                Already have an account?

                                <a href="/login">
                                    Login
                                </a>
                            </p>

                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


</body>

</html>

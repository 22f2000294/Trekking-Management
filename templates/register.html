<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h2>User Registration</h2>

<form method="POST">

    <input type="text"
       name="full_name"
       placeholder="Full Name"
       minlength="3"
       maxlength="100"
       required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="password"
       name="password"
       placeholder="Password"
       minlength="6"
       required>

    <br><br>

    <select name="role" required>
        <option value="">Select Role</option>
        <option value="trekker">Trekker</option>
        <option value="staff">Trek Staff</option>
    </select>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>

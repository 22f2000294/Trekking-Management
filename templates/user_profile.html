<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update User Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body style="background-color: #061280;">

<div class="container py-5">
    <div class="row justify-content-center"
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="text-center mb-4">
                        Update User Profile
                    </h1>


                    <form method="POST">

                        <!-- Full Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   value="{{ user.full_name }}"
                                   class="form-control"
                                   required>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   value="{{ user.email }}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- New Password -->

                        <div class="mb-4">

                            <label class="form-label">
                                Enter New Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Leave blank if no change">

                        </div>

                        <!-- Update Button -->

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Update Profile

                        </button>


                    </form>


                    <!-- Back Button -->

                    <div class="mt-3">

                        <a href="/user/dashboard"
                           class="btn btn-outline-dark w-100">

                            Back to Dashboard

                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
